name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag for the release"
        required: true
        default: "v1.0.0"
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  id-token: none

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.203"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish Application
        run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=true -o publish

      - name: Rename Executable
        shell: pwsh
        run: |
          if (Test-Path -Path "publish\cs2_bhop.exe") {
            Rename-Item -Path "publish\cs2_bhop.exe" -NewName "cs2-bhop.exe"
          }
          else {
            Write-Host "cs2_bhop.exe not found. Checking for cs2-bhop.exe..."
            if (Test-Path -Path "publish\cs2-bhop.exe") {
              Write-Host "Found cs2-bhop.exe, renaming not required."
            }
            else {
              Write-Error "Executable file not found in the publish folder."
            }
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs2-bhop
          path: publish/cs2-bhop.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: cs2-bhop
          path: ./artifact-download

      - name: Verify Downloaded Artifact
        run: |
          echo "Listing artifact-download directory:"
          ls -la ./artifact-download
          if [ ! -f ./artifact-download/cs2-bhop.exe ]; then
            echo "Error: File cs2-bhop.exe not found in artifact-download directory!"
            exit 1
          fi

      - name: Prepare Release Body
        run: |
          # Create badges section
          cat > badges.md << 'EOF'

          [![Downloads](https://img.shields.io/github/downloads/Jesewe/cs2-bhop/${{ github.event.inputs.tag_name }}/total?style=for-the-badge&logo=github&color=8E44AD)](https://github.com/Jesewe/cs2-bhop/releases/tag/${{ github.event.inputs.tag_name }}) [![Platforms](https://img.shields.io/badge/platform-Windows-blue?style=for-the-badge&color=8E44AD)](https://github.com/Jesewe/cs2-bhop/releases/download/${{ github.event.inputs.tag_name }}/cs2-bhop.exe) [![License](https://img.shields.io/github/license/jesewe/cs2-bhop?style=for-the-badge&color=8E44AD)](https://github.com/Jesewe/cs2-bhop/blob/main/LICENSE)
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: CS2 Bhop - ${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Release' }} ${{ github.event.inputs.tag_name }}
          body_path: ./badges.md
          generate_release_notes: true
          files: |
            ./artifact-download/cs2-bhop.exe
          prerelease: ${{ github.event.inputs.prerelease }}

      - name: Send Telegram Notification
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🎉 New ${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Release' }}: CS2 Bhop ${{ github.event.inputs.tag_name }} has been published! Check it out: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag_name }}"

      - name: Send Telegram Notification on Failure
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }} \
          -d text="🚨 ${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Release' }} Failed: CS2 Bhop ${{ github.event.inputs.tag_name }}. Check the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send Discord Notification
        if: success()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{\"content\": \"🎉 New ${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Release' }}: CS2 Bhop ${{ github.event.inputs.tag_name }} has been published! Check it out: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag_name }}\"}"

      - name: Send Discord Notification on Failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_ADMIN_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{\"content\": \"🚨 ${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Release' }} Failed: CS2 Bhop ${{ github.event.inputs.tag_name }}. Check the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
